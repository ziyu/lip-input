name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      accept_android_sdk_terms:
        description: "I have reviewed and accept https://developer.android.com/studio/terms for this build"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend test dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Backend tests (no weights, no real inference)
        run: python -m pytest server/tests -q
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Client core tests (no Android SDK)
        working-directory: android
        run: ./gradlew --no-daemon -p core-tests test
  android:
    # setup-android accepts SDK terms; require operator authorization before running.
    if: github.event_name == 'workflow_dispatch' && inputs.accept_android_sdk_terms == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit test
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lip-input-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
